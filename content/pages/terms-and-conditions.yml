title: Terms and Conditions
slug: terms-and-conditions
status: published
seo:
  title: Wash4You Terms and Conditions for Laundry Services
  description: >-
    Read Wash4You terms and conditions to understand our laundry and
    dry-cleaning process, pickup and delivery policies, and customer
    rights in Delhi and Gurgaon.
  canonical: https://wash4you.in/terms-and-conditions/
sections:
  - type: page_header
    id: sec_terms_header
    visible: true
    props:
      eyebrow: Policy
      heading: Terms and Conditions
  - type: legal_body
    id: sec_terms_body
    visible: true
    props:
      clauses:
        - heading: General
          content: >-
            By using Wash4You's services, you accept these Terms &
            Conditions. These apply to all garments, footwear, accessories,
            curtains, carpets, and other items provided for laundry,
            pressing, alteration, repair, or cleaning. Wash4You adheres to
            standard industry procedures but cannot guarantee outcomes
            beyond the natural limitations of fabric composition, dyes, and
            trims. Customers are advised to read these terms before placing
            an order.
        - heading: Scope of Services
          content: >-
            Wash4You provides laundry (wash & fold, wash & iron), dry
            cleaning, and pressing; shoe and bag cleaning, as well as
            leather and suede care; curtain and carpet cleaning services.
            All offerings include complimentary home pickup and delivery
            within designated service areas, as determined by management.
            Curtain cleaning includes free removal and reinstallation after
            service. Typical turnaround time is 5 to 7 working days from
            the pickup date. No compensation will be provided for delays
            arising from logistical, environmental, or technical
            challenges.
        - heading: Liability
          content: >-
            Our maximum liability in the event of loss, theft, or damage is
            limited to five times the service fee for the affected item,
            excluding curtains, carpets, and leather goods. Items with
            embellishments such as sequins, beads, lace, or delicate
            fabrics are processed at the customer's risk. Cleaning methods
            are chosen based on care labels or professional judgment when
            absent. No guarantees are made regarding complete stain
            removal. Wash4You is not liable for color fading or shrinkage
            caused by poor-quality dyes or fabrics; existing damage or wear
            and tear; or deterioration of synthetic or leather components
            including hydrolysis or cracking of PU soles. Internal
            assessment reports are final and binding in resolving disputes.
        - heading: Claims & Complaints
          content: >-
            All claims regarding lost, missing, or damaged items must be
            submitted within 24 hours of delivery and must include the
            original invoice. Claims submitted after this period will not
            be entertained. All approved claims will be settled at the
            company's discretion, limited to the stated liability cap.
            Items marked 'cleaned at owner's risk' are not eligible for
            compensation. Contact details: Email: care@wash4you.in, Phone:
            +91 63 67 600 500.
        - heading: Delivery & Storage
          content: >-
            Delivery is typically completed within 5 to 7 business days.
            Items left unclaimed beyond 15 days will incur a monthly
            storage fee of 30% of the invoice amount. Items uncollected for
            more than 90 days will be treated as abandoned and may be
            discarded with no liability for articles disposed of after this
            period.
        - heading: Payments
          content: >-
            All prices exclude GST and applicable taxes. Full payment is
            required before or at the time of delivery. Delayed payments
            are subject to an annual interest of 18% from the date of
            invoice. Accepted payment methods include cash, cards, UPI, and
            other digital platforms.
        - heading: Customer Responsibilities
          content: >-
            Customers must ensure all valuables are removed from garments
            prior to handover; notify if any home treatments or chemicals
            have been applied; and provide accurate delivery and contact
            details. Complaints post-delivery will not be considered.
        - heading: Communication Consent
          content: >-
            By availing Wash4You services, customers agree to receive
            communication via SMS, WhatsApp, phone, or email for service
            and promotional purposes. Transactional messages are mandatory.
            Promotional messages can be opted out of by contacting the
            company.
  - type: cta_banner
    id: sec_terms_cta
    visible: true
    props:
      buttons:
        - {label: "Questions? Contact us", href: "contact-us/", style: secondary}
        - {label: "Book free pickup", href: "pricing/?book=1", style: primary}
