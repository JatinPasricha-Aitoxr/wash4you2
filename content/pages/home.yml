- type: faq_accordion
  id: sec_home_26
  visible: true
  props:
    heading: Frequently asked questions
    items:
    - q: Is pickup and delivery really free?
      a: Yes. Doorstep collection and delivery are included at no extra charge anywhere we serve in Gurugram.
    - q: How do I know nothing goes missing?
      a: Every piece is counted with you at the door before it leaves, and you get a written acknowledgement
        of exactly what was collected. Your order is then bagged on its own — it never shares a machine
        or a bag with another customer's clothes.
    - q: What if a stain doesn't come out?
      a: Tell us what the stain is and roughly how old it is when you book, because that genuinely changes
        what we can do. Some stains — old oil, set ink, heat-fixed marks — may not lift completely. We
        would rather tell you that before we treat the garment than after.
    - q: Can you clean things other than clothes?
      a: Yes. Shoes and sneakers, handbags, leather, curtains, carpets, sofas, mattresses, blankets and
        soft toys. Sofas and mattresses are cleaned at your home; everything else is collected.
    - q: Which parts of Gurugram do you cover?
      a: Sushant Lok, Sector 49, Cyber City, DLF Phase 3, Golf Course Road, Golf Course Extension Road,
        Sohna Road, Sector 29, Palam Vihar and MG Road, plus the sectors around them. If you are not sure,
        send us a WhatsApp with your address and we will confirm.
    - q: How do I book a laundry pickup?
      a: Book a pickup online, or send a WhatsApp to +91 63 67 600 500 with your address and a time window
        that suits you.
