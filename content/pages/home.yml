    eyebrow: How it works
    heading: From your door and back, in seven steps.
    text: The same care as a specialist store, with the pickup and delivery done for you. Book online
      or on WhatsApp and we handle the rest, across Gurugram and Delhi NCR.
    steps:
    - title: Book a free pickup
      detail: Choose a time online or on WhatsApp. Pickup and delivery are always free across Gurugram
        and Delhi NCR.
    - title: Doorstep collection
      detail: We arrive at your slot and count every piece with you before it leaves. No guesswork, no
        mix-ups.
    - title: Sorting & inspection
      detail: Sorted by fabric and colour; stains, damage and special care are flagged by our fabric experts,
        photographed and sent to you for approval before any treatment starts.
    - title: Stain treatment
      detail: Marks are pre-treated by hand with the right, skin-safe solution for the fabric — gentle
        enough for kids' clothes.
    - title: Cleaning
      detail: Dry-cleaned or washed by the method each garment actually needs — an advanced, skin-safe
        dry-cleaning process for delicates and structured wear, water-based washing for the rest.
    - title: Finishing & quality check
      detail: Steam-pressed, re-counted and checked piece by piece against your list before packing.
    - title: Delivered to your door
      detail: Packed separately as your order and returned when we said we would — fresh, crisp, and ready
