<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wash4You Admin: Sign in</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head><body class="login-body">
<form class="login" id="form" autocomplete="on">
  <div class="login__brand"><span class="logo">W</span><b>Wash4You</b><i>Admin</i></div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" class="btn btn--primary" id="go">Sign in</button>
  <p class="login__err" id="err" role="alert"></p>
</form>
<script src="/admin/assets/login.js"></script>
</body></html>
